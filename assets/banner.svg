<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="network-security-labs - Cisco routing, switching and network security labs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152B"/>
      <stop offset="0.55" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0E3B5C"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1BA0D7" fill-opacity="0.18"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07152B" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#07152B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="220" rx="14" fill="url(#dots)"/>

  <!-- two-site topology motif -->
  <g stroke="#1BA0D7" stroke-opacity="0.6" stroke-width="1.8" fill="none">
    <path d="M820 60 L1060 60" stroke-dasharray="7 6"/>
    <path d="M820 60 L820 120 L820 175"/>
    <path d="M1060 60 L1060 120 L1060 175"/>
  </g>
  <g fill="#0B1F3A" stroke="#1BA0D7" stroke-width="2">
    <circle cx="820" cy="60" r="13"/>
    <circle cx="1060" cy="60" r="13"/>
    <rect x="806" y="111" width="28" height="18" rx="4"/>
    <rect x="1046" y="111" width="28" height="18" rx="4"/>
    <rect x="808" y="166" width="24" height="17" rx="3"/>
    <rect x="1048" y="166" width="24" height="17" rx="3"/>
  </g>
  <g fill="#1BA0D7"><circle cx="820" cy="60" r="4"/><circle cx="1060" cy="60" r="4"/></g>
  <g font-family="Consolas, Menlo, Monaco, monospace" font-size="12" fill="#5FB8DE">
    <text x="896" y="50">OSPF area 0</text>
    <text x="680" y="124">VLAN 10</text>
    <text x="1084" y="124">VLAN 20</text>
  </g>

  <rect width="1200" height="220" rx="14" fill="url(#fade)"/>

  <text x="60" y="96" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">network-security-labs</text>
  <text x="62" y="134" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#9FD8F2">Cisco routing  ·  switching  ·  network security</text>
  <text x="62" y="172" font-family="Consolas, Menlo, Monaco, monospace" font-size="14" fill="#3E8FB5">Built and verified in Cisco Packet Tracer 9.0</text>
</svg>
